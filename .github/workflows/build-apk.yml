name: Build APK - PentagonMan

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Instalar apktool actualizado
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar \
            -O /tmp/apktool.jar
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /tmp/apktool
          chmod +x /tmp/apktool
          sudo cp /tmp/apktool /usr/local/bin/apktool
          sudo cp /tmp/apktool.jar /usr/local/bin/apktool.jar

      - name: Descargar LÖVE APK oficial pre-compilado
        run: |
          wget -q https://github.com/love2d/love/releases/download/11.5/love-11.5-android.apk \
            -O love.apk

      - name: Descompilar APK con apktool
        run: apktool d love.apk -o love_decompiled --no-src -f

      - name: Empaquetar juego como .love
        run: |
          zip -9 -r game.love . \
            -x "*.git*" \
            -x ".github/*" \
            -x "love_decompiled/*" \
            -x "love.apk" \
            -x "README*" \
            -x "*.yml"

      - name: Inyectar .love en el APK
        run: |
          mkdir -p love_decompiled/assets
          cp game.love love_decompiled/assets/game.love

      - name: Poner nombre de la app
        run: |
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">PentagonMan</string>|' \
            love_decompiled/res/values/strings.xml

      - name: Fijar orientación landscape
        run: |
          sed -i 's/android:screenOrientation="[^"]*"/android:screenOrientation="sensorLandscape"/' \
            love_decompiled/AndroidManifest.xml

      - name: Copiar icono a todos los tamaños mipmap
        run: |
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )
          for dir in "${!SIZES[@]}"; do
            size="${SIZES[$dir]}"
            dest="love_decompiled/res/${dir}"
            mkdir -p "$dest"
            convert icon.png -resize "${size}x${size}" "${dest}/ic_launcher.png"
          done

      - name: Recompilar APK con apktool
        run: apktool b love_decompiled -o pentagonman_unsigned.apk

      - name: Firmar APK con debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          jarsigner -verbose \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -signedjar pentagonman.apk \
            pentagonman_unsigned.apk androiddebugkey

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PentagonMan-debug
          path: pentagonman.apk
          retention-days: 14